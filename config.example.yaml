# dbfailsim configuration. Copy to config.yaml and point listen_addr /
# upstream_addr at your real database nodes. See README "Config format".
control_addr: 127.0.0.1:8080
control_token: replace-with-a-long-random-token
nodes:
- name: primary
  role: primary
  listen_addr: 127.0.0.1:6432
  upstream_addr: 127.0.0.1:5432
  # target: how node-level faults (node_crash, zombie, cpu_throttle, oom,
  # clock_skew) reach the process. Omit it for a managed database.
  #   {type: process, pid_file: /var/run/postgresql/16-main.pid, start_command: "pg_ctlcluster 16 main start"}
  #   {type: systemd, unit: postgresql}
  #   {type: docker, container: dbfailsim-primary}
  #   {type: ssh, host: db2.internal, inner: {type: systemd, unit: postgresql}}
  target: {type: systemd, unit: postgresql}
  check_command: psql "postgresql://dbuser:dbpass@127.0.0.1:5432/appdb" -t -c "{query}"
- name: replica-1
  listen_addr: 127.0.0.1:6433
  upstream_addr: 127.0.0.1:5433
  check_command: psql "postgresql://dbuser:dbpass@127.0.0.1:5433/appdb" -t -c "{query}"
- name: replica-2
  listen_addr: 127.0.0.1:6434
  upstream_addr: 127.0.0.1:5434
  check_command: psql "postgresql://dbuser:dbpass@127.0.0.1:5434/appdb" -t -c "{query}"
scenarios:
- name: replica-lag
  description: 'replica-1 falls behind: added latency plus intermittent drops on its replication path'
  steps:
  - node: replica-1
    kind: latency
    latency_ms: 2000
    after_ms: 0
  - node: replica-1
    kind: drop
    drop_percent: 15
    after_ms: 0
- name: split-brain
  description: 'Cluster splits: primary and replica-1 isolated from replica-2'
  steps:
  - node: primary
    kind: partition
    after_ms: 0
  - node: replica-1
    kind: partition
    after_ms: 0
- name: primary-crash
  description: Primary crashes outright partway through a batch of writes
  steps:
  - node: primary
    kind: crash
    after_ms: 3000
- name: degrading-link
  description: 'General-form faults: latency ramps from 50ms to 3s over 30s on replica-2, with 5% duplication;
    both clear after 45s'
  steps:
  - node: replica-2
    kind: latency
    after_ms: 0
    for_ms: 45000
    params:
      delay: 50ms
      jitter: 20ms
      ramp_to: 3s
      ramp_over: 30s
  - node: replica-2
    kind: duplication
    after_ms: 0
    for_ms: 45000
    params:
      probability: 0.05
